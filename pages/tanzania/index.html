<style>
:root{--bg:#1a1b26;--bg2:#24283b;--fg:#c0caf5;--h1:#f7768e;--h2:#7aa2f7;--h3:#ff9e64;--link:#7dcfff;--gray:#565f89;--green:#9ece6a;--yellow:#e0af68;--border:#292e43}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"IBM Plex Mono","Roboto Mono",ui-monospace,Menlo,Monaco,Consolas,monospace;line-height:1.5;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:1.5rem 1rem 6rem}
a{color:var(--link)}
nav a{color:var(--gray);text-decoration:none;font-size:.9em}
h1{color:var(--h1);font-size:1.4em;margin:.8rem 0 .2rem}
.sub{color:var(--gray);font-size:.85em}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:.7rem 0;border-bottom:1px solid var(--border);margin-bottom:.5rem}
.prog{height:6px;background:var(--bg2);border-radius:3px;overflow:hidden;margin:.4rem 0}
.prog>div{height:100%;background:var(--green);transition:width .2s}
.controls{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;font-size:.85em}
button{font:inherit;font-size:.85em;background:var(--bg2);color:var(--fg);border:1px solid var(--border);border-radius:4px;padding:.25rem .6rem;cursor:pointer}
button.on{border-color:var(--h2);color:var(--h2)}
h2{color:var(--h2);font-size:1.05em;margin:1.6rem 0 .4rem;display:flex;justify-content:space-between;align-items:baseline;cursor:pointer;user-select:none}
h2 .c{color:var(--gray);font-size:.8em;font-weight:normal}
h2.done .c{color:var(--green)}
ul{list-style:none}
li{border-bottom:1px solid var(--border)}
label{display:flex;gap:.7rem;padding:.55rem .2rem;cursor:pointer;align-items:flex-start}
input[type=checkbox]{appearance:none;flex:0 0 1.15rem;height:1.15rem;margin-top:.15rem;border:2px solid var(--gray);border-radius:3px;display:grid;place-content:center;cursor:pointer}
input[type=checkbox]:checked{background:var(--green);border-color:var(--green)}
input[type=checkbox]:checked::after{content:"";width:.35rem;height:.65rem;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.t{flex:1;min-width:0}
.name{font-weight:600}
.meta{font-size:.78em;color:var(--gray)}
.det{font-size:.8em;color:#a9b1d6;margin-top:.15rem}
li.chk .name{text-decoration:line-through;color:var(--gray)}
li.chk .det{display:none}
.b{display:inline-block;font-size:.7em;padding:0 .35rem;border-radius:3px;margin-right:.3rem;border:1px solid}
.b-OWN{color:var(--green);border-color:var(--green)}.b-BUY{color:var(--yellow);border-color:var(--yellow)}.b-RENT{color:var(--h3);border-color:var(--h3)}.b-BOUGHT{color:var(--link);border-color:var(--link)}.b-other{color:var(--gray);border-color:var(--gray)}
.b-CHECK{color:var(--h1);border-color:var(--h1)}
table{width:100%;border-collapse:collapse;font-size:.8em;margin:.3rem 0}
td,th{border-bottom:1px solid var(--border);padding:.35rem .3rem;text-align:left;vertical-align:top}
th{color:var(--gray);font-weight:normal}
.note{font-size:.8em;color:var(--gray);margin:.3rem 0}
.hidechk li.chk{display:none}
.collapsed + .body{display:none}
.sync{font-size:.75em;color:var(--gray)}
</style>
</head>

<script>
(function(){
var KEY="tz-packing-v2",secs=JSON.parse(document.getElementById("data").textContent);
var st={};try{st=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
var ui={};try{ui=JSON.parse(localStorage.getItem(KEY+"-ui"))||{}}catch(e){}
function save(){localStorage.setItem(KEY,JSON.stringify(st))}
function saveUi(){localStorage.setItem(KEY+"-ui",JSON.stringify(ui))}
function esc(s){var d=document.createElement("div");d.textContent=s||"";return d.innerHTML}
function badge(p){if(!p)return"";var k=p.split(" ")[0].toUpperCase(),cls=["OWN","BUY","RENT","BOUGHT"].indexOf(k)>=0?k:"other";return '<span class="b b-'+cls+'">'+esc(p)+'</span>'}
var root=document.getElementById("list"),all=[];
secs.forEach(function(s,si){
  var h=document.createElement("h2");h.innerHTML='<span>'+esc(s.title.replace(/^\d+\.\s*/,"").toLowerCase())+'</span><span class="c"></span>';
  var body=document.createElement("div");body.className="body";
  if(s.rows&&s.rows.length){var cols=Object.keys(s.rows[0]);var t="<table><tr>"+cols.map(function(c){return"<th>"+esc(c)+"</th>"}).join("")+"</tr>";
    s.rows.forEach(function(r){t+="<tr>"+cols.map(function(c){return"<td>"+esc(r[c])+"</td>"}).join("")+"</tr>"});body.innerHTML=t+"</table>"}
  (s.notes||[]).forEach(function(n){var p=document.createElement("p");p.className="note";p.textContent=n;body.appendChild(p)});
  var ul=document.createElement("ul");
  s.items.forEach(function(it){
    var li=document.createElement("li");li.dataset.plan=(it.plan||"")+" "+(it.status||"");
    var meta=[];if(it.qty&&it.qty!=="-")meta.push("x"+it.qty);
    var det=[it.spec,it.notes].filter(function(x){return x&&x!=="-"}).join(" \u00b7 ");
    li.innerHTML='<label><input type="checkbox"><div class="t"><div class="name">'+esc(it.item)+'</div><div class="meta">'+badge(it.plan)+(it.status==="CHECK"?'<span class="b b-CHECK">decide</span>':"")+esc(meta.join(" "))+(it.status&&it.status!=="CHECK"?" "+esc(it.status):"")+'</div>'+(det?'<div class="det">'+esc(det)+'</div>':"")+'</div></label>';
    var cb=li.querySelector("input");cb.checked=!!st[it.id];li.classList.toggle("chk",cb.checked);
    cb.addEventListener("change",function(){if(cb.checked)st[it.id]=Date.now();else delete st[it.id];li.classList.toggle("chk",cb.checked);save();render()});
    ul.appendChild(li);all.push({id:it.id,li:li,h:h,si:si});
  });
  body.appendChild(ul);
  if(ui["c"+si])h.classList.add("collapsed");
  h.addEventListener("click",function(){h.classList.toggle("collapsed");ui["c"+si]=h.classList.contains("collapsed");saveUi()});
  root.appendChild(h);root.appendChild(body);s._h=h;s._n=s.items.length;
});
function render(){
  var tot=all.length,done=all.filter(function(a){return st[a.id]}).length;
  document.getElementById("total").textContent=done+" / "+tot+" packed";
  document.getElementById("pbar").style.width=(tot?100*done/tot:0)+"%";
  secs.forEach(function(s,si){if(!s._n){s._h.querySelector(".c").textContent="";return}
    var d=all.filter(function(a){return a.si===si&&st[a.id]}).length;s._h.querySelector(".c").textContent=d+"/"+s._n;s._h.classList.toggle("done",d===s._n)});
  root.classList.toggle("hidechk",!!ui.hide);document.getElementById("hide").classList.toggle("on",!!ui.hide);
  document.getElementById("todo").classList.toggle("on",!!ui.todo);
  all.forEach(function(a){a.li.style.display=ui.todo&&!/BUY|RENT|CHECK|PRESCRIPTION/i.test(a.li.dataset.plan)?"none":""});
}
document.getElementById("hide").onclick=function(){ui.hide=!ui.hide;saveUi();render()};
document.getElementById("todo").onclick=function(){ui.todo=!ui.todo;saveUi();render()};
document.getElementById("reset").onclick=function(){if(confirm("Uncheck everything?")){st={};save();all.forEach(function(a){a.li.querySelector("input").checked=false;a.li.classList.remove("chk")});render()}};
window.addEventListener("storage",function(e){if(e.key===KEY){location.reload()}});
render();
})();
</script>
