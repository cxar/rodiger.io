<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Paxos Health · rodiger.io</title>
    <meta name="description" content="Paxos-issued stablecoins and tokenized gold at a glance: supply, where it moved, peg and usage, with unusual changes flagged." />
    <link rel="preload" href="/api/paxos" as="fetch" crossorigin="anonymous" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon/favicon-16x16.png" />
    <link rel="icon" type="image/x-icon" href="/static/favicon/favicon.ico" />
    <link rel="stylesheet" href="/static/css/style.css" />
    <link rel="stylesheet" href="/paxos/paxos.css" />
    <script defer src="/paxos/vendor/chart.umd.min.js" integrity="sha256-SERKgtTty1vsDxll+qzd4Y2cF9swY9BCq62i9wXJ9Uo="></script>
    <script defer src="/paxos/app.js"></script>
  </head>
  <body class="paxos">
    <div class="container">
      <nav class="top"><a href="/" class="back" aria-label="Back to home">&larr; back</a></nav>
      <header class="head">
        <h1>Paxos Health</h1>
        <button type="button" class="chip" id="chip" data-action="chip"><span>Loading…</span></button>
        <span class="sr-only" id="chip-live" role="status" aria-live="polite"></span>
      </header>
      <div class="chip-extra" id="chip-extra" hidden></div>

      <div class="scope" id="scope">
        <div class="seg assets" id="f-asset" role="group" aria-label="Asset"></div>
        <div class="seg period" id="f-range" role="group" aria-label="Period"></div>
      </div>
      <div class="compact" id="compact" hidden></div>

      <main id="content">
        <p class="notice" id="notice" hidden></p>
        <div class="verdict" id="verdict"><span class="ico" aria-hidden="true"></span><span class="vtext" role="status" aria-live="polite">Loading the latest snapshot…</span></div>

        <section class="overview" id="overview" aria-labelledby="h-overview">
          <h2 class="sr-only" id="h-overview">Overview</h2>
          <div class="hero" id="hero"><div class="h-label">&nbsp;</div><div class="h-fig empty">—</div><div class="h-delta">&nbsp;</div></div>
          <div class="brief" id="brief"></div>
        </section>

        <section id="cards-sec" aria-labelledby="h-cards">
          <h2 class="sr-only" id="h-cards">Coins</h2>
          <div class="cards" id="cards"><div class="acard placeholder"><div class="acard-body"></div></div><div class="acard placeholder"><div class="acard-body"></div></div><div class="acard placeholder"><div class="acard-body"></div></div><div class="acard placeholder"><div class="acard-body"></div></div></div>
        </section>

        <section class="lens-sec" id="lens-sec" aria-labelledby="h-lens">
          <h2 class="sr-only" id="h-lens">Details</h2>
          <div class="tabs" id="tabs" role="tablist" aria-label="Details"></div>
          <div class="panel" id="panel" role="tabpanel"></div>
        </section>

        <details class="fold" id="all-findings" data-k="findings"><summary>All findings</summary><div class="body" data-body></div></details>
        <details class="fold about" id="about" data-k="about"><summary>About this data</summary><div class="body" data-body></div></details>
      </main>
      <footer class="pfoot"><a href="/">rodiger.io</a> · <a href="/api/paxos">Raw data (JSON)</a></footer>
    </div>
    <noscript><p>This dashboard needs JavaScript to load its data.</p></noscript>
  </body>
</html>
